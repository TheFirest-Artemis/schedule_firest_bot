<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Расписание пар</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="banner">
  <div class="banner-top">
    <h1>Расписание пар</h1>
    <div class="banner-actions">
      <button id="themeBtn" class="icon-btn" title="Сменить тему">🌙</button>
      <button id="refreshBtn" class="icon-btn" title="Обновить">⟳</button>
    </div>
  </div>
  <div id="dateRange" class="banner-sub"></div>
  <div class="banner-sub-row">
    <span id="groupLabel" class="banner-sub"></span>
    <button id="changeGroupBtn" class="link-btn">изменить</button>
  </div>
</header>

<main id="content">
  <div id="loading" class="status-text">Загрузка расписания…</div>
</main>

<div id="groupModal" class="modal hidden">
  <div class="modal-card">
    <h2>Ваша группа</h2>
    <p class="modal-hint">Например: 2615-2</p>
    <input id="groupInput" class="group-input" type="text" inputmode="text" autocomplete="off" placeholder="2615-2">
    <div id="groupError" class="error-text hidden"></div>
    <button id="groupSaveBtn" class="primary-btn">Сохранить</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
